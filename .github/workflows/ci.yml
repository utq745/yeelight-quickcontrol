name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Sources
        run: |
          node --check server.js
          awk '/<script>/{f=1;next}/<\/script>/{f=0}f' dashboard.html | node --check -
          bash -n build.sh

      - name: Test Standalone Controller
        run: npm test

      - name: Test Native Controller
        run: ./macos/Tests/run.sh

      - name: Build Application
        run: ./build.sh

      - name: Verify Bundle
        run: |
          test -x "Yeelight QuickControl.app/Contents/MacOS/YeelightQuickControl"
          plutil -lint "Yeelight QuickControl.app/Contents/Info.plist"
          codesign --verify --deep --strict "Yeelight QuickControl.app"
          lipo -archs "Yeelight QuickControl.app/Contents/MacOS/YeelightQuickControl" | grep -q x86_64
          lipo -archs "Yeelight QuickControl.app/Contents/MacOS/YeelightQuickControl" | grep -q arm64
          test -x "Yeelight QuickControl.app/Contents/Helpers/Toggle Light.app/Contents/MacOS/ActionHelper"
          test "$(plutil -extract YQCCommandURL raw "Yeelight QuickControl.app/Contents/Helpers/Toggle Light.app/Contents/Info.plist")" = "yeelight-quickcontrol://toggle"
          plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw "Yeelight QuickControl.app/Contents/Info.plist" | grep -qx yeelight-quickcontrol

      - name: Self-Test Dashboard Bridge
        run: YEELIGHT_QUICKCONTROL_SELFTEST=1 "Yeelight QuickControl.app/Contents/MacOS/YeelightQuickControl"
